name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build .NET Projects
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: |
          dotnet restore src/FuncPulse.Core/FuncPulse.Core.csproj
          dotnet restore src/FuncPulse.Web/FuncPulse.Web.csproj
          dotnet restore tests/FuncPulse.Tests/FuncPulse.Tests.csproj
      
      - name: Build Core project
        run: dotnet build src/FuncPulse.Core/FuncPulse.Core.csproj --configuration Release --no-restore
      
      - name: Build Web project
        run: dotnet build src/FuncPulse.Web/FuncPulse.Web.csproj --configuration Release --no-restore
      
      - name: Build Tests project
        run: dotnet build tests/FuncPulse.Tests/FuncPulse.Tests.csproj --configuration Release --no-restore
